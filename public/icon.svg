<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" fill="none" />
  
  <!-- Vinyl disc groves -->
  <circle cx="256" cy="256" r="165" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" fill="none" />
  <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" fill="none" />
  
  <!-- Electric Sound Wave / Equalizer behind note -->
  <g opacity="0.85">
    <rect x="136" y="270" width="16" height="70" rx="8" fill="url(#neonGrad)" />
    <rect x="164" y="230" width="16" height="110" rx="8" fill="url(#neonGrad)" />
    <rect x="192" y="200" width="16" height="140" rx="8" fill="url(#goldGrad)" />
    <rect x="304" y="190" width="16" height="150" rx="8" fill="url(#goldGrad)" />
    <rect x="332" y="220" width="16" height="120" rx="8" fill="url(#neonGrad)" />
    <rect x="360" y="260" width="16" height="80" rx="8" fill="url(#neonGrad)" />
  </g>
  
  <!-- Rock Music Central Emblem: Musical Note + Lightning Rock Accent -->
  <g filter="url(#glow)">
    <path d="M230 140 L340 115 L340 270 A 45 45 0 1 1 295 230 A 45 45 0 0 1 315 235 L315 160 L245 175 L245 300 A 45 45 0 1 1 200 260 A 45 45 0 0 1 230 270 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Star of DRC / Congo glow -->
  <polygon points="256,70 263,88 282,90 267,102 272,120 256,110 240,120 245,102 230,90 249,88" fill="#fbbf24" />
  
  <!-- Text Rock Music -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">ROCK MUSIC</text>
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#fbbf24" text-anchor="middle" letter-spacing="2">RDC • CONGO • MONDE</text>
</svg>
